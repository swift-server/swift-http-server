name: PR

permissions:
  contents: read

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  soundness:
    name: Soundness
    uses: swiftlang/github-workflows/.github/workflows/soundness.yml@0.0.19
    with:
      api_breakage_check_container_image: "swift:6.4-resolute"
      format_check_container_image: "swift:6.4-resolute"
      license_header_check_project_name: "Swift HTTP Server"
      linux_pre_build_command: "export SWIFT_CERTIFICATES_ALLOW_SWIFT_CRYPTO_BETA=1 ENABLE_ALL_TRAITS=1"

  tests:
    name: Tests
    uses: swiftlang/github-workflows/.github/workflows/package_test.yml@f977e5189c1fcc23abb681efa9f066e8b28ba14f  # main, for https://github.com/swiftlang/github-workflows/pull/362
    with:
      linux_command: |
        Debug-Test: swift test
        Release-Build: swift build -c release
      linux_version_overrides: |
        default: --explicit-target-dependency-import-check error -Xswiftc -require-explicit-sendable
        nightly-release: --explicit-target-dependency-import-check error
        nightly-main: --explicit-target-dependency-import-check error
      linux_env_vars: '{"SWIFT_CERTIFICATES_ALLOW_SWIFT_CRYPTO_BETA":"1", "ENABLE_ALL_TRAITS":"1"}'
      enable_macos: false
      enable_macos_swiftly: false
      enable_windows: false
      enable_wasm_sdk_build: false
      enable_embedded_wasm_sdk_build: false
      enable_android_sdk_build: false
      enable_freebsd: false
